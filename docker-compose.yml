services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban-ai-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban}
      POSTGRES_DB: ${POSTGRES_DB:-kanban_ai}
    volumes:
      - kanban_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban_ai}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ───────────────────────────────────────────────────────────────────────────
  # API containerizada em MODO PROJECT (default) — revisão parcial do ADR-0019.
  #
  # `docker compose up -d` sobe **postgres + api + web** (um comando inicia tudo).
  # Isto voltou a ser possível porque, com o EP-PROJECT, o repo-alvo de uma story
  # é um **clone gerenciado** dentro do volume nomeado `kanban_projects`
  # (montado em `PROJECTS_DIR=/data/projects`): o `cwd` do spawn do agent é
  # **interno e previsível**, não mais um `aiProject` arbitrário do host. Ver
  # ADR-0038 (supersede parcial do ADR-0019).
  #
  # O modo HOST legado continua suportado para `aiProject` (repos fora do volume):
  # suba só `docker compose up -d postgres` e rode a API no host com `npm run dev`
  # (ver ADR-0019 e CONTRIBUTING.md).
  # ───────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kanban-ai-api
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Com network_mode host o banco é acessível via localhost.
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-kanban}@localhost:5432/${POSTGRES_DB:-kanban_ai}?schema=public'
      API_PORT: '3333'
      WS_PATH: ${WS_PATH:-/ws}
      AGENT_DEFAULT_MODEL: ${AGENT_DEFAULT_MODEL:-opus}
      AGENT_RUNNER_KIND: ${AGENT_RUNNER_KIND:-mock}
      AGENT_CLI_COMMAND: ${AGENT_CLI_COMMAND:-copilot}
      AGENT_CLI_ARGS: ${AGENT_CLI_ARGS:-}
      AGENT_CLI_PROMPT_MODE: ${AGENT_CLI_PROMPT_MODE:-stdin}
      # Copilot CLI: a imagem (apps/api/Dockerfile) tenta instalar @github/copilot,
      # mas sob proxy TLS corporativo o npm install -g falha (tolerado). Fallback:
      # montamos o pacote @github/copilot do HOST (via HOST_COPILOT_BIN_DIR) em
      # /opt/copilot:ro e apontamos COPILOT_BIN para o loader montado. O pacote do
      # host é self-contained (traz node_modules) e roda com o node do container.
      COPILOT_BIN: ${COPILOT_BIN:-/opt/copilot/npm-loader.js}
      AGENT_MAX_CONCURRENT_SESSIONS: ${AGENT_MAX_CONCURRENT_SESSIONS:-3}
      AGENT_WATCHDOG_INTERVAL_MS: ${AGENT_WATCHDOG_INTERVAL_MS:-120000}
      AGENT_WORKSPACES_DIR: ${AGENT_WORKSPACES_DIR:-./.agent-workspaces}
      # MODO PROJECT: os clones gerenciados vivem no volume nomeado kanban_projects,
      # montado abaixo. Path INTERNO ao container (não mais aiProject do host) →
      # o cwd do spawn do agent é previsível (ADR-0038).
      PROJECTS_DIR: ${PROJECTS_DIR:-/data/projects}
      PROJECTS_GIT_TIMEOUT_MS: ${PROJECTS_GIT_TIMEOUT_MS:-300000}
      PROJECTS_ALLOW_SSH: ${PROJECTS_ALLOW_SSH:-false}
      # GIT_SSH_COMMAND injetado no clone/fetch via SSH. O default cobre o caso
      # container: usa a chave montada em /root/.ssh/id_ed25519, ignora o
      # ~/.ssh/config do host (que o ssh recusaria por dono ≠ root — "Bad owner
      # or permissions") via -F /dev/null, e força porta 443/ssh.github.com
      # (firewall corporativo costuma bloquear a porta 22). Ajuste/limpe se seu
      # ambiente usa porta 22 ou outra chave. NUNCA contém segredo (só flags).
      PROJECTS_SSH_COMMAND: ${PROJECTS_SSH_COMMAND:-ssh -F /dev/null -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/root/.ssh/known_hosts -o IdentityFile=/root/.ssh/id_ed25519 -o IdentitiesOnly=yes -o Hostname=ssh.github.com -p 443}
      # ── Autenticação do Copilot CLI DENTRO do container (risco #1 do ADR-0019) ──
      # Opção B: token passado por env (repasse do host, sem default). O adapter e
      # o CLI honram COPILOT_GITHUB_TOKEN/GH_TOKEN/GITHUB_TOKEN quando presentes.
      # No host o copilot costuma autenticar via `gh` CLI (~/.config/gh); como o
      # container não tem `gh`, repassamos o token por env (ex.: no .env local:
      # COPILOT_GITHUB_TOKEN=$(gh auth token)).
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Watch confiável em bind mount (inotify não propaga bem no Docker).
      CHOKIDAR_USEPOLLING: 'true'
      TSC_WATCHFILE: 'DynamicPriorityPolling'
      TSC_WATCHDIRECTORY: 'DynamicPriorityPolling'
    volumes:
      # Código + node_modules do host (bind mount) para hot-reload e para evitar
      # `npm ci` no container (proxy TLS corporativo — ver apps/api/Dockerfile).
      - .:/app
      # Clones gerenciados dos Projects — volume nomeado, path INTERNO previsível.
      - kanban_projects:/data/projects
      # Opção A (recomendada) de auth do Copilot CLI: monta a config/credenciais
      # do CLI do host como read-only. HOST_COPILOT_DIR default ~/.copilot; o CLI
      # procura sua config no HOME → montamos em /root/.copilot (HOME do root no
      # container). Comente esta linha se preferir só o token via GH_TOKEN.
      # RW (sem :ro): o Copilot CLI grava session-store.db e o session-state a
      # cada iteração; com :ro dá "Read-only file system (os error 30)".
      - ${HOST_COPILOT_DIR:-~/.copilot}:/root/.copilot
      # Chave SSH do host (read-only) para clone de Projects via git@... quando
      # PROJECTS_ALLOW_SSH=true. O clone ssh delega ao `git`/`ssh` do container,
      # que procura a identidade em $HOME/.ssh (/root/.ssh do root). Sem isto o
      # clone de repo privado por ssh falha (timeout/permission denied).
      # HOST_SSH_DIR default ~/.ssh. Requer known_hosts com github.com (ou o
      # container usa StrictHostKeyChecking desligado via /root/.ssh/config).
      - ${HOST_SSH_DIR:-~/.ssh}:/root/.ssh:ro
      # Copilot CLI do HOST (self-contained, traz node_modules) montado :ro em
      # /opt/copilot como fallback quando o npm install -g da imagem falha (proxy
      # TLS corporativo). COPILOT_BIN aponta p/ /opt/copilot/npm-loader.js e o
      # adapter roda com o node do container. HOST_COPILOT_BIN_DIR default aponta
      # p/ o pacote instalado via nvm; ajuste se seu copilot está noutro caminho.
      - ${HOST_COPILOT_BIN_DIR:-~/.nvm/versions/node/v22.17.1/lib/node_modules/@github/copilot}:/opt/copilot:ro
    entrypoint: ['sh', '/app/docker/api-dev-entrypoint.sh']

  # ───────────────────────────────────────────────────────────────────────────
  # Frontend em container. Sobe junto no `docker compose up -d` (postgres + api +
  # web) para um único comando de start. Usa a imagem de dev com hot-reload
  # (bind mount do código do host). O Vite roda no container e é acessível em
  # http://localhost:5173 (network_mode host).
  # ───────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kanban-ai-web
    restart: unless-stopped
    network_mode: host
    depends_on:
      - api
    environment:
      WEB_PORT: '5173'
      # O Vite (no navegador do host) fala com a API pela porta publicada no host.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3333}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3333/ws}
      # Com network_mode host o proxy do Vite encaminha para a API via localhost.
      VITE_API_PROXY_TARGET: 'http://localhost:3333'
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
    entrypoint: ['sh', '/app/docker/web-dev-entrypoint.sh']

volumes:
  kanban_pgdata:
  # Raiz gerenciada dos clones de Project (<PROJECTS_DIR>/<projectId>). Path
  # INTERNO ao container → habilita a API containerizada em modo Project (ADR-0038).
  kanban_projects:
