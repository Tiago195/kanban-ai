services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban-ai-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban}
      POSTGRES_DB: ${POSTGRES_DB:-kanban_ai}
    volumes:
      - kanban_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban_ai}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ───────────────────────────────────────────────────────────────────────────
  # API containerizada em MODO PROJECT (default) — revisão parcial do ADR-0019.
  #
  # `docker compose up -d` (SEM `--profile docker-app`) sobe **api + postgres**.
  # Isto voltou a ser possível porque, com o EP-PROJECT, o repo-alvo de uma story
  # é um **clone gerenciado** dentro do volume nomeado `kanban_projects`
  # (montado em `PROJECTS_DIR=/data/projects`): o `cwd` do spawn do agent é
  # **interno e previsível**, não mais um `aiProject` arbitrário do host. Ver
  # ADR-0038 (supersede parcial do ADR-0019).
  #
  # O modo HOST legado continua suportado para `aiProject` (repos fora do volume):
  # NÃO suba este serviço e rode a API no host com `npm run dev` (ver ADR-0019 e
  # CONTRIBUTING.md). O profile `docker-app` (acrescenta o `web` em container)
  # permanece como opção documentada.
  # ───────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kanban-ai-api
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Com network_mode host o banco é acessível via localhost.
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-kanban}@localhost:5432/${POSTGRES_DB:-kanban_ai}?schema=public'
      API_PORT: '3333'
      WS_PATH: ${WS_PATH:-/ws}
      AGENT_DEFAULT_MODEL: ${AGENT_DEFAULT_MODEL:-opus}
      AGENT_RUNNER_KIND: ${AGENT_RUNNER_KIND:-mock}
      AGENT_CLI_COMMAND: ${AGENT_CLI_COMMAND:-copilot}
      AGENT_CLI_ARGS: ${AGENT_CLI_ARGS:-}
      AGENT_CLI_PROMPT_MODE: ${AGENT_CLI_PROMPT_MODE:-stdin}
      # Copilot CLI instalado na imagem (apps/api/Dockerfile) → no PATH do container.
      COPILOT_BIN: ${COPILOT_BIN:-copilot}
      AGENT_MAX_CONCURRENT_SESSIONS: ${AGENT_MAX_CONCURRENT_SESSIONS:-3}
      AGENT_WATCHDOG_INTERVAL_MS: ${AGENT_WATCHDOG_INTERVAL_MS:-120000}
      AGENT_WORKSPACES_DIR: ${AGENT_WORKSPACES_DIR:-./.agent-workspaces}
      # MODO PROJECT: os clones gerenciados vivem no volume nomeado kanban_projects,
      # montado abaixo. Path INTERNO ao container (não mais aiProject do host) →
      # o cwd do spawn do agent é previsível (ADR-0038).
      PROJECTS_DIR: ${PROJECTS_DIR:-/data/projects}
      PROJECTS_GIT_TIMEOUT_MS: ${PROJECTS_GIT_TIMEOUT_MS:-300000}
      PROJECTS_ALLOW_SSH: ${PROJECTS_ALLOW_SSH:-false}
      # ── Autenticação do Copilot CLI DENTRO do container (risco #1 do ADR-0019) ──
      # Opção B: token passado por env (repasse do host, sem default). O adapter e
      # o CLI honram GH_TOKEN/GITHUB_TOKEN quando presentes.
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Watch confiável em bind mount (inotify não propaga bem no Docker).
      CHOKIDAR_USEPOLLING: 'true'
      TSC_WATCHFILE: 'DynamicPriorityPolling'
      TSC_WATCHDIRECTORY: 'DynamicPriorityPolling'
    volumes:
      # Código + node_modules do host (bind mount) para hot-reload e para evitar
      # `npm ci` no container (proxy TLS corporativo — ver apps/api/Dockerfile).
      - .:/app
      # Clones gerenciados dos Projects — volume nomeado, path INTERNO previsível.
      - kanban_projects:/data/projects
      # Opção A (recomendada) de auth do Copilot CLI: monta a config/credenciais
      # do CLI do host como read-only. HOST_COPILOT_DIR default ~/.copilot; o CLI
      # procura sua config no HOME → montamos em /root/.copilot (HOME do root no
      # container). Comente esta linha se preferir só o token via GH_TOKEN.
      - ${HOST_COPILOT_DIR:-~/.copilot}:/root/.copilot:ro
    entrypoint: ['sh', '/app/docker/api-dev-entrypoint.sh']

  # ───────────────────────────────────────────────────────────────────────────
  # Frontend em container atrás do profile opt-in `docker-app` (ADR-0019). Sobe
  # só com `docker compose --profile docker-app up -d`; no fluxo normal rode o
  # web no host com `npm run dev:web`. Fica separado da API para manter o default
  # (`docker compose up -d`) enxuto: api + postgres. O `api` default já roda em
  # container com bind mount, então este profile só ACRESCENTA o `web`.
  # ───────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kanban-ai-web
    restart: unless-stopped
    network_mode: host
    # Opt-in: por padrão rode o web no host (`npm run dev:web`).
    profiles: ['docker-app']
    depends_on:
      - api
    environment:
      WEB_PORT: '5173'
      # O Vite (no navegador do host) fala com a API pela porta publicada no host.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3333}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3333/ws}
      # Com network_mode host o proxy do Vite encaminha para a API via localhost.
      VITE_API_PROXY_TARGET: 'http://localhost:3333'
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
    entrypoint: ['sh', '/app/docker/web-dev-entrypoint.sh']

volumes:
  kanban_pgdata:
  # Raiz gerenciada dos clones de Project (<PROJECTS_DIR>/<projectId>). Path
  # INTERNO ao container → habilita a API containerizada em modo Project (ADR-0038).
  kanban_projects:
