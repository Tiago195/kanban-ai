services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban-ai-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban}
      POSTGRES_DB: ${POSTGRES_DB:-kanban_ai}
    volumes:
      - kanban_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban_ai}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kanban-ai-api
    restart: unless-stopped
    network_mode: host
    # ARQUITETURA (ver ADR-0019): por padrão a API NÃO roda no Docker. Ela roda
    # no HOST (`npm run dev:api`) para que o loop engine/agent enxergue o
    # filesystem inteiro do host e trabalhe em qualquer repositório-alvo
    # (aiProject) sem remontar volumes. Este serviço fica atrás do profile
    # `docker-app` e só sobe se explicitamente pedido:
    #   docker compose --profile docker-app up -d api
    # (nesse modo o agent só enxerga /app — use apenas para dev do próprio Nest).
    profiles: ['docker-app']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Com network_mode host o banco é acessível via localhost.
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-kanban}@localhost:5432/${POSTGRES_DB:-kanban_ai}?schema=public'
      API_PORT: '3333'
      WS_PATH: ${WS_PATH:-/ws}
      AGENT_DEFAULT_MODEL: ${AGENT_DEFAULT_MODEL:-opus}
      AGENT_RUNNER_KIND: ${AGENT_RUNNER_KIND:-mock}
      AGENT_CLI_COMMAND: ${AGENT_CLI_COMMAND:-copilot}
      AGENT_CLI_ARGS: ${AGENT_CLI_ARGS:-}
      AGENT_CLI_PROMPT_MODE: ${AGENT_CLI_PROMPT_MODE:-stdin}
      COPILOT_BIN: ${COPILOT_BIN:-copilot}
      AGENT_MAX_CONCURRENT_SESSIONS: ${AGENT_MAX_CONCURRENT_SESSIONS:-3}
      AGENT_WATCHDOG_INTERVAL_MS: ${AGENT_WATCHDOG_INTERVAL_MS:-120000}
      AGENT_WORKSPACES_DIR: ${AGENT_WORKSPACES_DIR:-./.agent-workspaces}
      # Watch confiável em bind mount (inotify não propaga bem no Docker).
      CHOKIDAR_USEPOLLING: 'true'
      # tsc (nest --watch) usa o watcher do TypeScript, não o chokidar — força polling.
      TSC_WATCHFILE: 'DynamicPriorityPolling'
      TSC_WATCHDIRECTORY: 'DynamicPriorityPolling'
    # Bind mount do repositório inteiro (código + node_modules do host) para
    # hot-reload. As node_modules do host são glibc/Debian, compatíveis com
    # a imagem node:22 (ver Dockerfile.dev). Não instalamos deps no container.
    volumes:
      - .:/app
    entrypoint: ['sh', '/app/docker/api-dev-entrypoint.sh']

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kanban-ai-web
    restart: unless-stopped
    network_mode: host
    # Também opt-in (ver `api`): por padrão rode o web no host (`npm run dev:web`).
    profiles: ['docker-app']
    depends_on:
      - api
    environment:
      WEB_PORT: '5173'
      # O Vite (no navegador do host) fala com a API pela porta publicada no host.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3333}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3333/ws}
      # Com network_mode host o proxy do Vite encaminha para a API via localhost.
      VITE_API_PROXY_TARGET: 'http://localhost:3333'
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
    entrypoint: ['sh', '/app/docker/web-dev-entrypoint.sh']

volumes:
  kanban_pgdata:
